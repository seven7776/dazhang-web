<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导航图标 · 大张工作台</title>
<style>
:root{--paper:#F5F4EC;--card:#FDFDFA;--ink:#18302E;--mist:#6E7C75;--line:#E5E7D9;--accent:#177E70;--accent-deep:#0E5A50;--accent-tint:#DCF0EB;--amber:#C07A1E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);padding:0 0 60px;font-size:14px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
.hd{padding:26px 6px 8px}
.hd h1{margin:0;font-size:24px;letter-spacing:1px}
.hd p{margin:6px 0 0;color:var(--mist);font-size:13px}
.preview{position:sticky;top:0;z-index:10;background:var(--paper);padding:10px 6px;border-bottom:.5px solid var(--line)}
.pv-bar{display:flex;gap:6px;overflow-x:auto;padding:4px 2px}
.pv-bar::-webkit-scrollbar{display:none}
.pv-item{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pv-ico{width:40px;height:40px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px}
.pv-lbl{font-size:9px;color:var(--mist)}
.board{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:12px 0;box-shadow:0 1px 2px rgba(20,48,44,.05)}
.board .bn{font-size:15px;font-weight:700;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.board .bn .cur{font-size:20px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{width:46px;height:46px;border-radius:12px;background:var(--paper);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:all .12s}
.opt:active{transform:scale(.92)}
.opt.sel{background:var(--accent-tint);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-tint)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;box-shadow:0 -4px 16px rgba(20,48,44,.06)}
.bar button{flex:1;border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:1px}
.btn-reset{background:var(--paper);color:var(--mist);border:1px solid var(--line)}
.btn-done{background:var(--accent);color:#fff}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:rgba(20,48,44,.92);color:#fff;border-radius:16px;padding:8px 18px;font-size:13px;display:none;z-index:99}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1>导航图标</h1>
    <p>点一下换上，回到工作台自动生效（存在本机）。</p>
  </div>
  <div class="preview">
    <div class="pv-bar" id="pvBar"></div>
  </div>
  <div id="list"></div>
</div>
<div class="bar">
  <button class="btn-reset" onclick="resetAll()">恢复默认</button>
  <button class="btn-done" onclick="history.back()">完成</button>
</div>
<div class="toast" id="toast"></div>
<script>
var BOARDS=[
 {p:'home',n:'首页',opts:['🏠','🏡','🌅','☀️','⭐','🗓️','📋','🎯']},
 {p:'wenyi',n:'文艺科',opts:['🏛️','🎨','🎭','🖌️','📜','🏵️','🎪','🖼️']},
 {p:'qicai',n:'七彩和弦',opts:['🎵','🎶','🌈','🎹','🎼','🎤','🕊️','✨']},
 {p:'social',n:'社会事务',opts:['🎭','🤝','🌐','📣','🗂️','🧭','💼','🏵️']},
 {p:'studio',n:'录音棚',opts:['🎙️','🎤','🎧','🎚️','🎛️','🔊','📻','🎵']},
 {p:'family',n:'家庭生活',opts:['🌿','🏡','💚','🍵','🛋️','🌷','🧺','👨‍👩‍👧‍👦']},
 {p:'account',n:'记账',opts:['💰','🧮','💳','📒','🪙','💴','📊','🛒']},
 {p:'english',n:'英语学习',opts:['📖','🔤','🗣️','📚','✏️','🌍','🆎','🎓']},
 {p:'fun',n:'娱乐休闲',opts:['🎬','🍿','🎡','🎮','🎧','🌴','🎢','📺']},
 {p:'growth',n:'个人提升',opts:['📈','🌱','🚀','🎯','💪','🏆','🔥','✨']},
 {p:'trash',n:'回收站',opts:['🗑️','♻️','🧹','📥','🗂️']}
];
var DEFAULT={home:'🏠',wenyi:'🏛️',qicai:'🎵',social:'🎭',studio:'🎙️',family:'🌿',account:'💰',english:'📖',fun:'🎬',growth:'📈',trash:'🗑️'};
function getMap(){try{return JSON.parse(localStorage.getItem('navIcons')||'{}');}catch(e){return {};}}
function cur(p){var m=getMap();return m[p]||DEFAULT[p];}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._tm);t._tm=setTimeout(function(){t.style.display='none';},1500);}
function renderPreview(){
  var bar=document.getElementById('pvBar');
  bar.innerHTML=BOARDS.map(function(b){
    return '<div class="pv-item"><div class="pv-ico">'+cur(b.p)+'</div><div class="pv-lbl">'+b.n+'</div></div>';
  }).join('');
}
function render(){
  document.getElementById('list').innerHTML=BOARDS.map(function(b){
    var opts=b.opts.map(function(e){
      var sel=e===cur(b.p)?' sel':'';
      return '<div class="opt'+sel+'" onclick="pick(\''+b.p+'\',\''+e+'\')">'+e+'</div>';
    }).join('');
    return '<div class="board"><div class="bn"><span class="cur">'+cur(b.p)+'</span>'+b.n+'</div><div class="opts">'+opts+'</div></div>';
  }).join('');
  renderPreview();
}
function pick(p,e){var m=getMap();m[p]=e;localStorage.setItem('navIcons',JSON.stringify(m));render();toast('已换上 '+e);}
function resetAll(){localStorage.removeItem('navIcons');render();toast('已恢复默认');}
render();
</script>
</body>
</html>
